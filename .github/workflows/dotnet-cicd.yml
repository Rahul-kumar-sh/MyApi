name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    env:
      DOTNET_SKIP_WORKLOAD_UPDATE_NOTIFICATION: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore MyApi.sln --disable-parallel

      - name: Build solution
        run: dotnet build MyApi.sln -c Release --no-restore

      - name: Run tests (ignore if no tests)
        run: dotnet test MyApi.sln -c Release --no-build --no-restore || true

      - name: Publish application
        run: dotnet publish MyApi/MyApi.csproj -c Release -o ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-build
          path: ./publish
