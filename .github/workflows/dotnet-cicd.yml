name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MyApi/MyApi.csproj

      - name: Build
        run: dotnet build MyApi/MyApi.csproj -c Release --no-restore

      - name: Test
        run: dotnet test MyApi/MyApi.sln -c Release --no-build || true

      - name: Publish
        run: dotnet publish MyApi/MyApi.csproj -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-build
          path: ./publish

